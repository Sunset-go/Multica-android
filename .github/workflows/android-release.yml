# Build a release APK on every `v*` tag push and attach it to a GitHub
# Release, so users can download installable APKs from the Releases page.
#
# Flow (matches apps/mobile/CLAUDE.md "Build & release" rules):
#   1. version-bump --set <tag>  — write the EXACT tag version (v0.2.3 → 0.2.3)
#      into package.json / app.config.ts / build.gradle, so the release APK
#      is versioned identically to the tag (not bumped +1, which is the
#      local dev-build rule).
#   2. expo prebuild --platform android — the android/ dir is git-ignored, so
#      CI regenerates it from app.config.ts before building.
#   3. gradlew assembleRelease — universal build (all ABIs) so any device
#      can install the APK.
#   4. copy-versioned-apk — rename to apps/mobile/dist/multica-app-v<v>.apk.
#   5. action-gh-release — attach the APK to the Release for this tag.
#
# Tag version source: GITHUB_REF_NAME is the tag (e.g. "v0.2.3"); strip the
# leading "v" to get the semver.
name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      # 两个变体并行构建，分别上传到同一个 Release：
      #   - universal (默认，包含全部 ABI，~110 MB)  —— 兼容老设备
      #   - arm64-v8a-only (~30 MB)                  —— 现代手机首选
      # 两者文件名不同，softprops/action-gh-release 会各追加一个 asset，不冲突。
      fail-fast: false
      matrix:
        include:
          - arch: universal
            suffix: ""
          - arch: arm64-v8a
            suffix: "-arm64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` 包在 Google 的仓库里已被移除；显式只装 platform-tools，
          # 避免 action 默认的 `sdkmanager tools` 命令 404 导致整个 step 失败。
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Ensure debug keystore
        run: |
          if [ ! -f apps/mobile/android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore apps/mobile/android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set version from tag
        run: node apps/mobile/scripts/bump-android-version.mjs --set "${GITHUB_REF_NAME#v}"

      # 跨 run 缓存 Gradle 依赖，避免每次 matrix job 都从网络拉 AGP / RN / NDK。
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/mobile/android/**/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ARCH" = "universal" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleRelease -PreactNativeArchitectures=$ARCH
          fi

      - name: Copy versioned APK
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: node apps/mobile/scripts/copy-versioned-apk.mjs

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/multica-app-v*.apk
          generate_release_notes: true
